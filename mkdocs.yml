site_name: System Resource Monitor Docs
site_url: https://example.com/system-resource-monitor
use_directory_urls: false
site_dir: .artifacts/manual-site

theme:
  name: material
  language: ko
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.top
    - search.suggest
    - search.highlight
    - content.code.copy

markdown_extensions:
  - admonition
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true

extra:
  search:
    tokenizer: ko

extra_css:
  - stylesheets/extra.css

nav:
  - 사용자 매뉴얼: index.md
  - 문서 허브: DocsHub.md
  - Active Docs: ActiveDocs.md
  - Current Phase:
      - Overview: "Current Phase/CurrentPhase.md"
      - Verification Checklist: "Current Phase/VerificationChecklist.md"
  - Architecture:
      - System Overview: "Architecture/SystemOverview.md"
      - Runtime And Packaging: "Architecture/RuntimeAndPackaging.md"
  - Best Practices:
      - Documentation Workflow: "Best Practices/DocumentationWorkflow.md"
      - Engineering Guidelines: "Best Practices/EngineeringGuidelines.md"
  - Wiki:
      - Project Structure: "Wiki/ProjectStructure.md"
      - User Manual: "Wiki/UserManual.md"
      - Reliability Report: "Wiki/ReliabilityReport.md"
      - Changelog: "Wiki/Changelog.md"
  - Future:
      - Roadmap: "Future/Roadmap.md"
      - Ideas And Backlog: "Future/IdeasAndBacklog.md"
