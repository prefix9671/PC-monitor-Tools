[meta]
doc_prefix = "docs/"
generated_prefixes = [
  ".artifacts/",
  "build/",
  "dist/",
  "site/",
  "__pycache__/",
  "dashboards/__pycache__/",
]
ignored_globs = [
  "bug/**",
  "tests/*.log",
  "tools/playwright-mcp/*.png",
  "tools/playwright-mcp/*-snapshot.md",
  "tools/playwright-mcp/*.txt",
]
code_change_exempt_prefixes = [
  "AGENTS.md",
  "README.md",
  ".gitignore",
]
baseline_required_docs = [
  "docs/Current Phase/VerificationChecklist.md",
]

[[rules]]
name = "collector-or-loader"
trigger_prefixes = [
  "collectors/",
  "config.py",
  "data_loader.py",
  "parsers.py",
  "inspector_logs/",
  "cli.py",
  "aoi_cli.py",
]
required_docs = [
  "docs/Architecture/SystemOverview.md",
  "docs/Wiki/ProjectStructure.md",
]

[[rules]]
name = "dashboard-or-ui"
trigger_prefixes = [
  "app.py",
  "dashboards/",
  "excel_exporter.py",
]
required_docs = [
  "docs/Wiki/UserManual.md",
]

[[rules]]
name = "packaging-or-runtime"
trigger_prefixes = [
  "build.bat",
  "monitor.spec",
  "run_app.py",
  "start_monitor.bat",
  "Monitor.ps1",
  "mkdocs.yml",
  "test_portable.bat",
  "scripts/prepare_lhm_bundle.py",
  "scripts/publish_release_to_share.ps1",
]
required_docs = [
  "docs/Architecture/RuntimeAndPackaging.md",
  "docs/Wiki/Changelog.md",
  "docs/Wiki/ReliabilityReport.md",
  "docs/Current Phase/CurrentPhase.md",
]

[[rules]]
name = "ci-or-verification-automation"
trigger_prefixes = [
  ".github/workflows/",
  "scripts/verify_docs_sync.py",
  "scripts/run_ci_dashboard_smoke.py",
]
required_docs = [
  "docs/Wiki/ReliabilityReport.md",
]

[[rules]]
name = "playwright-or-regression-automation"
trigger_prefixes = [
  "scripts/run_prebuild_regression.py",
  "scripts/verify_playwright_dashboards.js",
  "scripts/verify_playwright_prebuild_regression.js",
  "scripts/capture_user_manual_assets.js",
  "tools/playwright-mcp/launch-playwright-mcp.ps1",
  "tools/playwright-mcp/verify-playwright-mcp.ps1",
]
required_docs = [
  "docs/Architecture/RuntimeAndPackaging.md",
  "docs/Current Phase/VerificationChecklist.md",
  "docs/Wiki/ReliabilityReport.md",
]

[[rules]]
name = "agent-or-doc-workflow"
trigger_prefixes = [
  "AGENTS.md",
  "docs/ActiveDocs.md",
  "docs/DocsHub.md",
  "docs/Best Practices/DocumentationWorkflow.md",
  "scripts/verify_docs_sync.py",
  "scripts/doc_sync_rules.toml",
]
required_docs = [
  "docs/Best Practices/DocumentationWorkflow.md",
]
